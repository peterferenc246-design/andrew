<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Osobný album Andreja Ferenca – momentky zo života.">
  <meta name="theme-color" content="#0b63ce">
  <title>Osobný album | Andrej Ferenc</title>
  <style>
    :root{--blue:#0b63ce;--blue2:#1677e8;--navy:#06213f;--ink:#102033;--muted:#66788c;--line:#dfe7f1;--shadow:0 20px 60px rgba(8,43,83,.13)}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f7fbff 0,#fff 45%)}
    a{color:inherit;text-decoration:none} button{font:inherit}
    .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .top-in{width:min(calc(100% - 32px),1180px);margin:auto;min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:850}.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--blue2),#0a315d);box-shadow:0 10px 24px rgba(11,99,206,.25)}
    .back{padding:11px 16px;border:1px solid #cfdceb;border-radius:12px;background:#fff;color:#0a315d;font-weight:800}
    main{width:min(calc(100% - 32px),1180px);margin:auto;padding:64px 0 90px}.eyebrow{display:inline-block;color:var(--blue);font-size:.78rem;font-weight:900;letter-spacing:.14em;margin-bottom:12px}
    h1{margin:0;font-size:clamp(2.6rem,7vw,5.4rem);line-height:1;letter-spacing:-.045em}.lead{max-width:680px;color:var(--muted);font-size:1.08rem;margin:20px 0 38px}
    .album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.album-card{position:relative;min-height:330px;padding:0;border:0;border-radius:20px;overflow:hidden;background:#dfe9f4;box-shadow:var(--shadow);cursor:pointer}.album-card:nth-child(1){grid-row:span 2}.album-card:nth-child(4){grid-column:span 2}
    .album-card img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease,filter .3s ease}.album-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(3,25,49,.78))}.album-card span{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff;font-weight:850;font-size:1rem;text-align:left}.album-card:hover img{transform:scale(1.035);filter:saturate(1.08)}
    .loading{padding:28px;border:1px solid var(--line);border-radius:18px;color:var(--muted);background:#fff}
    .lightbox{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(2,17,31,.92);backdrop-filter:blur(8px)}.lightbox.open{display:grid}.lightbox figure{margin:0;max-width:min(1000px,94vw)}.lightbox img{display:block;max-width:94vw;max-height:82vh;border-radius:16px;box-shadow:0 28px 80px rgba(0,0,0,.4)}.lightbox figcaption{color:#fff;text-align:center;font-weight:800;margin-top:12px}.close{position:absolute;top:20px;right:24px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:2rem;line-height:1;cursor:pointer}
    footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.88rem;text-align:center}
    @media(max-width:900px){.album-grid{grid-template-columns:repeat(2,1fr)}.album-card:nth-child(1){grid-row:span 1}.album-card:nth-child(4){grid-column:span 1}}
    @media(max-width:620px){.top-in{min-height:70px}main{padding-top:42px}.album-grid{grid-template-columns:1fr}.album-card{min-height:300px}.back{padding:9px 12px;font-size:.9rem}}
  </style>
</head>
<body>
  <header class="top"><div class="top-in"><a class="brand" href="index.html"><span class="mark">AF</span><span>Andrej Ferenc</span></a><a class="back" href="index.html#galeria">← Späť na stránku</a></div></header>
  <main>
    <span class="eyebrow">OSOBNÝ ALBUM</span>
    <h1>Momentky zo života</h1>
    <p class="lead">Fotografie a spomienky z osobného života Andreja.</p>
    <div id="album" class="album-grid"><div class="loading">Načítavam fotografie…</div></div>
  </main>
  <footer>© <span id="year"></span> Andrej Ferenc</footer>
  <div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" type="button" aria-label="Zavrieť">×</button><figure><img src="" alt=""><figcaption></figcaption></figure></div>
  <script>
    const photos=[
      ['assets/album/andrej-pool.b64','Pri bazéne','Andrej pri bazéne'],
      ['assets/album/motivacia-ver-si.b64','Ver si','Motivačný obrázok s textom o viere v seba'],
      ['assets/album/motivacia-nevzdavaj-sa.b64','Nevzdávaj sa','Motivačný obrázok s jesennou prírodou'],
      ['assets/album/andrej-minigolf.b64','Minigolf','Andrej pri minigolfe'],
      ['assets/album/andrej-detstvo.b64','Spomienka z detstva','Spomienková fotografia z detstva']
    ];
    document.getElementById('year').textContent=new Date().getFullYear();
    const album=document.getElementById('album');
    const lb=document.getElementById('lightbox'),li=lb.querySelector('img'),lc=lb.querySelector('figcaption');
    function closeLb(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.style.overflow=''}
    Promise.all(photos.map(async([url,title,alt])=>({title,alt,src:'data:image/jpeg;base64,'+(await fetch(url).then(r=>{if(!r.ok)throw new Error(url);return r.text()})).trim()})))
      .then(items=>{album.innerHTML='';items.forEach(({title,alt,src})=>{const b=document.createElement('button');b.className='album-card';b.type='button';b.setAttribute('aria-label','Otvoriť fotografiu: '+title);b.innerHTML='<img alt=""><span></span>';const img=b.querySelector('img');img.src=src;img.alt=alt;b.querySelector('span').textContent=title;b.addEventListener('click',()=>{li.src=src;li.alt=alt;lc.textContent=title;lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'});album.appendChild(b)})})
      .catch(()=>{album.innerHTML='<div class="loading">Fotografie sa nepodarilo načítať. Skúste stránku obnoviť.</div>'});
    lb.querySelector('.close').addEventListener('click',closeLb);lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
  </script>
</body>
</html>
